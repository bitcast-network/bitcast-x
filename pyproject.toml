[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcast-x"
version = "2.1.0"
description = "Bittensor v11 miner and validator for Bitcast X"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bitcast" }]
maintainers = [{ name = "Bitcast" }]
keywords = ["bitcast", "bittensor", "miner", "sn93", "validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "bittensor==11.0.2",
    "diskcache==5.6.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "numpy==2.0.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
]

[project.scripts]
bitcast-x = "bitcast_x.main:main"

[project.urls]
Homepage = "https://github.com/bitcast-network/bitcast-x"
Documentation = "https://github.com/bitcast-network/bitcast-x/blob/main/docs/protocol.md"
Repository = "https://github.com/bitcast-network/bitcast-x.git"
Issues = "https://github.com/bitcast-network/bitcast-x/issues"
Security = "https://github.com/bitcast-network/bitcast-x/security/policy"
Support = "https://github.com/bitcast-network/bitcast-x/blob/main/SUPPORT.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bitcast_x"]

[[tool.mypy.overrides]]
module = ["bittensor", "bittensor.*"]
ignore_missing_imports = true
