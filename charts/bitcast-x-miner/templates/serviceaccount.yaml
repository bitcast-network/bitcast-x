{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bitcast-x-miner.serviceAccountName" . }}
  labels:
    {{- include "bitcast-x-miner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The miner calls no Kubernetes API.
automountServiceAccountToken: false
{{- end }}
