name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.23
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uvx --from semgrep==1.172.0 semgrep scan --config p/python --error --no-git-ignore src

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build container
        env:
          IMAGE_VERSION: "3.0.0"
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          docker build
          --build-arg VERSION="${IMAGE_VERSION}"
          --build-arg REVISION="${SOURCE_REVISION}"
          -t bitcast-x:test .
      - run: docker run --rm bitcast-x:test --help
      - run: test "$(docker run --rm bitcast-x:test --version)" = "bitcast-x 3.0.0"
      - run: test "$(docker run --rm --entrypoint id bitcast-x:test -u)" = "10001"
      - run: docker run --rm --entrypoint python bitcast-x:test -c 'import bitcast_x; print(bitcast_x.__version__)'
      - run: test "$(docker inspect bitcast-x:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "3.0.0"
      - name: Verify revision label
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: test "$(docker inspect bitcast-x:test --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${SOURCE_REVISION}"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # Helm is preinstalled on GitHub's ubuntu-latest runners.
      - name: Lint and render the miner chart
        working-directory: charts/bitcast-x-miner
        run: |
          set -eu
          required="--set publicIP=203.0.113.10 --set wallet.existingSecret=hotkey"
          helm lint . $required
          helm template t . $required > /dev/null
          helm template t . $required --set mode=run-miner-api --set minerApi.existingSecret=api > /dev/null
          helm template t . $required --set service.type=NodePort --set port=30095 \
            | grep -q "nodePort: 30095"
          # extraVolumes/extraVolumeMounts reach the pod spec verbatim.
          helm template t . $required \
            --set-json 'extraVolumes=[{"name":"cfg","configMap":{"name":"c"}}]' \
            --set-json 'extraVolumeMounts=[{"name":"cfg","mountPath":"/etc/cfg"}]' \
            -s templates/deployment.yaml | grep -q "mountPath: /etc/cfg"
          # A separate API port: the setting reaches the container, gets its own ClusterIP
          # Service, and never joins the public validator Service, whatever its type.
          api="$required --set mode=run-miner-api --set minerApi.existingSecret=api --set minerApi.port=8092"
          helm template t . $api -s templates/deployment.yaml | grep -q "name: BITCAST_X_MINER_API_PORT"
          helm template t . $api -s templates/api.yaml | grep -q "type: ClusterIP"
          if helm template t . $api --set service.type=NodePort --set port=30095 \
              -s templates/service.yaml | grep -q 8092; then
            echo "the API port leaked into the public Service"; exit 1
          fi
          helm template t . $api --set minerApi.ingress.enabled=true \
            --set minerApi.ingress.host=api.example.test -s templates/api.yaml \
            | grep -q "path: /api/v1"
      - name: Refuse configurations that cannot work
        working-directory: charts/bitcast-x-miner
        run: |
          set -u
          refuse() {
            if helm template t . "$@" > /dev/null 2>&1; then
              echo "rendered but should have been refused: $*"; exit 1
            fi
          }
          refuse --set wallet.existingSecret=hotkey
          refuse --set publicIP=203.0.113.10
          refuse --set publicIP=127.0.0.1 --set wallet.existingSecret=hotkey
          refuse --set publicIP=0.0.0.0 --set wallet.existingSecret=hotkey
          refuse --set publicIP=203.0.113.10 --set wallet.existingSecret=hotkey --set mode=run-miner-api
          refuse --set publicIP=203.0.113.10 --set wallet.existingSecret=hotkey --set service.type=NodePort
          refuse --set publicIP=203.0.113.10 --set wallet.existingSecret=hotkey --set mode=run-validator
          api="--set publicIP=203.0.113.10 --set wallet.existingSecret=hotkey --set minerApi.existingSecret=api"
          refuse $api --set minerApi.port=8092
          refuse $api --set mode=run-miner-api --set minerApi.port=8095
          refuse $api --set mode=run-miner-api --set minerApi.ingress.enabled=true --set minerApi.ingress.host=h
          refuse $api --set mode=run-miner-api --set minerApi.port=8092 --set minerApi.ingress.enabled=true
